[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecorutas-api"
version = "0.1.0"
description = "API de rutas de naturaleza en Chile"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.104,<1",
  "uvicorn[standard]>=0.24,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.19,<1",
  "alembic>=1.12,<2",
  "pydantic-settings>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "black>=23.11",
  "httpx>=0.25,<1",
  "mypy>=1.7",
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4.1",
  "ruff>=0.1",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]


[tool.vercel]
entrypoint = "src.main:app"
