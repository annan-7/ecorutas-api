services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ecorutas
      POSTGRES_USER: ecorutas
      POSTGRES_PASSWORD: ecorutas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecorutas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://ecorutas:ecorutas@db:5432/ecorutas
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

